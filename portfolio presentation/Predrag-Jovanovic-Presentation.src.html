<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Predrag Jovanovic — Work</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root{
    --bg:#07080d;
    --panel:#0e1119;
    --line:#1e2534;
    --txt:#e2e8f4;
    --dim:#8592aa;
    --dimmer:#59637a;
    --cyan:#22d3ee;
    --violet:#a78bfa;
    --gold:#fbbf24;
    --green:#34d399;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }

  html,body{height:100%}
  body{
    background:var(--bg);color:var(--txt);font-family:var(--sans);
    overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  body::before{
    content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(800px 420px at 12% -8%, rgba(34,211,238,.10), transparent 60%),
      radial-gradient(700px 420px at 92% 108%, rgba(167,139,250,.10), transparent 60%),
      linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px) 0 0/100% 3px;
  }

  /* ── shell: HUD / stage / info / rail, all in one viewport ── */
  .deck{
    position:relative;z-index:1;height:100dvh;
    display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;
    gap:12px;padding:12px 16px 14px;
  }

  /* ── top HUD ─────────────────────────────────── */
  .hud{
    display:flex;align-items:center;gap:14px;
    font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--dimmer);
  }
  .hud .me{color:var(--txt);font-weight:700;letter-spacing:.16em}
  .hud .me em{color:var(--cyan);font-style:normal;font-weight:400}
  .hud .spacer{flex:1}
  .hud a{color:var(--dimmer);text-decoration:none;transition:color .15s}
  .hud a:hover,.hud a:focus-visible{color:var(--cyan);outline:none}

  .pips{display:flex;gap:5px}
  .pips button{
    width:20px;height:5px;border-radius:20px;border:0;padding:0;cursor:pointer;
    background:#232b3c;transition:background .2s,box-shadow .2s,width .2s;
  }
  .pips button:hover{background:#3a4459}
  .pips button[aria-current="true"]{width:30px;background:var(--cyan);box-shadow:0 0 12px rgba(34,211,238,.6)}
  .pips button.ref[aria-current="true"]{background:var(--violet);box-shadow:0 0 12px rgba(167,139,250,.6)}

  /* ── stage ───────────────────────────────────── */
  .stage{position:relative;min-height:0}

  /* absolute + definite height, and flex (not grid) — only there does the image's
     max-height:100% actually resolve, otherwise max-width wins and it overflows */
  .frame{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .frame img{
    display:block;max-width:100%;max-height:100%;width:auto;height:auto;
    border-radius:8px;border:1px solid var(--line);
    box-shadow:0 26px 70px rgba(0,0,0,.65);
    cursor:zoom-in;background:#0b0e15;
  }
  /* corner brackets framing the stage — 4 corners, 2 pseudos each on stage + frame */
  .stage::before,.stage::after,.frame::before,.frame::after{
    content:'';position:absolute;width:24px;height:24px;pointer-events:none;z-index:2;
    border:2px solid var(--cyan);opacity:.6;
  }
  .frame::before{top:0;left:0;border-right:0;border-bottom:0}
  .frame::after{bottom:0;right:0;border-left:0;border-top:0}
  .stage::before{top:0;right:0;border-left:0;border-bottom:0}
  .stage::after{bottom:0;left:0;border-right:0;border-top:0}
  .stage.ref::before,.stage.ref::after,.frame.ref::before,.frame.ref::after{border-color:var(--violet)}

  /* prev / next */
  .nav{
    position:absolute;top:50%;transform:translateY(-50%);z-index:3;
    width:42px;height:64px;border-radius:10px;cursor:pointer;
    background:rgba(14,17,25,.82);border:1px solid var(--line);color:var(--dim);
    font-family:var(--mono);font-size:1.2rem;line-height:1;
    transition:border-color .15s,color .15s,background .15s;
  }
  .nav:hover,.nav:focus-visible{border-color:var(--cyan);color:var(--txt);background:var(--panel);outline:none}
  .nav[disabled]{opacity:.25;cursor:default}
  .nav.prev{left:0}
  .nav.next{right:0}

  /* ── intro card (slide 0) ────────────────────── */
  .intro{
    width:100%;max-width:760px;text-align:center;padding:34px 30px;
    background:linear-gradient(180deg,#12161f,var(--panel));
    border:1px solid var(--line);border-radius:14px;
  }
  .intro .kick{font-family:var(--mono);font-size:.68rem;letter-spacing:.28em;color:var(--cyan);text-transform:uppercase}
  .intro h1{font-size:clamp(1.9rem,5vw,3rem);font-weight:800;letter-spacing:-.02em;margin:10px 0 6px;line-height:1.05}
  .intro .class{font-family:var(--mono);font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:var(--violet)}
  .intro .facts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:22px 0 20px}
  .intro .facts span{
    font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;
    padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:#0b0e15;color:var(--dim);
  }
  .intro .facts b{color:var(--gold);font-weight:700}
  .intro .go{font-family:var(--mono);font-size:.72rem;letter-spacing:.2em;color:var(--dimmer);text-transform:uppercase}
  .intro .go kbd{
    font:inherit;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
    padding:2px 7px;color:var(--cyan);background:#0b0e15;
  }

  /* ── info bar ────────────────────────────────── */
  .info{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:12px 16px;background:var(--panel);border:1px solid var(--line);border-radius:11px;
  }
  .info .lead{min-width:0;flex:1 1 300px}
  .info .proj{
    font-family:var(--mono);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  }
  .info.ref .proj{color:var(--violet)}
  .info .cap{font-size:.98rem;font-weight:600;margin-top:4px;line-height:1.35}
  .info .sub{font-size:.86rem;color:var(--dim);line-height:1.45;margin-top:2px}
  .chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .chips span{
    font-family:var(--mono);font-size:.68rem;padding:3px 9px;border-radius:20px;
    background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.22);color:#9fe8f5;
  }
  .tag{
    font-family:var(--mono);font-size:.58rem;font-weight:700;letter-spacing:.14em;
    padding:3px 7px;border-radius:5px;text-transform:uppercase;
  }
  .tag.live{background:rgba(52,211,153,.13);color:var(--green);border:1px solid rgba(52,211,153,.35)}
  .tag.wip{background:rgba(251,191,36,.13);color:var(--gold);border:1px solid rgba(251,191,36,.35)}
  .tag.guest{background:rgba(167,139,250,.15);color:var(--violet);border:1px solid rgba(167,139,250,.45)}

  .cta{
    display:inline-flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap;
    font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;
    padding:9px 14px;border-radius:9px;background:#0b0e15;
    border:1px solid var(--line);color:var(--dim);
    transition:border-color .15s,color .15s,box-shadow .15s;
  }
  .cta:hover,.cta:focus-visible{color:var(--txt);border-color:var(--green);box-shadow:0 0 20px rgba(52,211,153,.16);outline:none}
  .cta::before{content:'▶';color:var(--green);font-size:.6rem}
  .cta.plain::before{content:none}
  .cta.plain:hover,.cta.plain:focus-visible{border-color:var(--cyan);box-shadow:0 0 20px rgba(34,211,238,.16)}

  /* the "not mine" disclosure, inline so it can't be missed */
  .disc{
    flex:1 1 100%;font-size:.82rem;line-height:1.5;color:var(--dim);
    padding:9px 12px;border-radius:8px;
    background:rgba(167,139,250,.07);border:1px solid rgba(167,139,250,.3);
  }
  .disc b{color:var(--violet)}

  /* ── thumbnail rail ──────────────────────────── */
  .rail{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
  .rail::-webkit-scrollbar{height:6px}
  .rail::-webkit-scrollbar-thumb{background:#232b3c;border-radius:20px}
  .rail button{
    flex:0 0 auto;width:104px;height:62px;padding:0;cursor:pointer;overflow:hidden;
    border:1px solid var(--line);border-radius:7px;background:#0b0e15;
    transition:border-color .15s,transform .15s,opacity .15s;opacity:.55;
  }
  .rail button img{width:100%;height:100%;object-fit:cover;object-position:top left;display:block}
  .rail button:hover,.rail button:focus-visible{opacity:1;transform:translateY(-2px);border-color:var(--dim);outline:none}
  .rail button[aria-current="true"]{opacity:1;border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
  .rail button.ref[aria-current="true"]{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet)}
  .rail button.intro{display:grid;place-items:center;font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;color:var(--dim)}

  /* ── zoom mode: image only ───────────────────── */
  body.zoom .hud,body.zoom .info,body.zoom .rail{display:none}
  body.zoom .deck{padding:0;gap:0;grid-template-rows:minmax(0,1fr)}
  body.zoom .nav,
  body.zoom .stage::before,body.zoom .stage::after,
  body.zoom .frame::before,body.zoom .frame::after{display:none}
  body.zoom .frame img{border-radius:0;border:0;cursor:zoom-out;box-shadow:none}
  #zhint{
    position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:5;display:none;
    font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;color:var(--dim);
    background:rgba(14,17,25,.9);border:1px solid var(--line);border-radius:8px;padding:6px 12px;
  }
  body.zoom #zhint{display:block}

  /* ── misc ────────────────────────────────────── */
  #snd{
    width:28px;height:28px;border-radius:7px;cursor:pointer;flex-shrink:0;
    background:#0b0e15;border:1px solid var(--line);color:var(--dimmer);
    font-size:.78rem;line-height:1;transition:border-color .15s,color .15s;
  }
  #snd:hover,#snd:focus-visible{border-color:var(--cyan);color:var(--cyan);outline:none}
  #snd[aria-pressed="true"]{color:var(--cyan);border-color:var(--cyan)}

  /* fixed, not absolute — an absolute one at the end of a 100dvh body adds a phantom scroll pixel */
  .sr{position:fixed;top:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (max-width:820px){
    body{overflow:auto}
    .deck{height:auto;min-height:100dvh}
    .stage{min-height:44vh}
    .nav{width:34px;height:52px}
    .hud .hide-sm,.hud .me em,.pips{display:none}
    .hud .me{white-space:nowrap}
    .intro{padding:26px 18px}
    .rail button{width:86px;height:52px}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
  }
</style>
</head>
<body>

<div class="deck">

  <!-- ── top HUD ── -->
  <div class="hud">
    <span class="me">Predrag Jovanovic <em>· Senior Frontend Engineer</em></span>
    <span class="spacer"></span>
    <span id="counter" class="hide-sm">00 / 00</span>
    <div class="pips" id="pips" role="tablist" aria-label="Slides"></div>
    <a href="mailto:j.predrag@gmail.com" class="hide-sm">j.predrag@gmail.com</a>
    <a href="../predrag-jovanovic-cv.pdf" download="Predrag-Jovanovic-CV.pdf">CV ↓</a>
    <button id="snd" type="button" aria-pressed="false" aria-label="Toggle interface sounds">🔈</button>
  </div>

  <!-- ── stage ── -->
  <div class="stage">
    <button class="nav prev" id="prev" type="button" aria-label="Previous slide">‹</button>
    <div class="frame" id="frame"></div>
    <button class="nav next" id="next" type="button" aria-label="Next slide">›</button>
  </div>

  <!-- ── info bar ── -->
  <div class="info" id="info"></div>

  <!-- ── thumbnail rail ── -->
  <div class="rail" id="rail" role="tablist" aria-label="Jump to slide"></div>
</div>

<div id="zhint">Click image or press <b>Esc</b> to exit full view</div>
<p class="sr" id="live" role="status" aria-live="polite"></p>

<script>
(() => {
'use strict';

/* ═══ SLIDES ═════════════════════════════════════════════ */
const S = [
  { intro: true, thumb: 'START' },

  {
    project: 'HomeStory', tag: ['live', 'Live · 2014 – present'],
    cap: 'Pennymac Home Connect — partner landing',
    sub: 'One of 15+ bank editions. Every partner is a tenant on the same codebase, with its own branding, copy, config and feature flags. I ship every edition’s frontend.',
    chips: ['React', 'Next.js', 'TypeScript', 'Multi-tenant', 'WCAG AAA'],
    url: 'https://pennymac.homestory.co/', urlLabel: 'Open pennymac.homestory.co',
    img: 'screenshots/opt/homestory pennymac.jpg'
  },
  {
    project: 'HomeStory', tag: ['live', 'Live'],
    cap: 'Property search — 6,839 results, Austin TX',
    sub: 'The core product: map clustering, boundary drawing, filters, saved searches and agent matching over tens of thousands of listings.',
    chips: ['React', 'Next.js', 'Mapbox', 'React Query', 'Accessibility'],
    url: 'https://pennymac.homestory.co/', urlLabel: 'Open live search',
    img: 'screenshots/opt/homestory pennymac search.jpg'
  },
  {
    project: 'HomeStory', tag: ['live', 'Live'],
    cap: 'SoFi Real Estate Center — same platform, different tenant',
    sub: 'Same underlying code as the Pennymac edition. Different brand, palette, imagery and configuration — this is what multi-tenant buys the business.',
    chips: ['Multi-tenant', 'Design tokens', 'LaunchDarkly', 'Partner onboarding'],
    url: 'https://sofi.homestory.co/', urlLabel: 'Open sofi.homestory.co',
    img: 'screenshots/opt/homestory sofi.jpg'
  },
  {
    project: 'HomeStory', tag: ['live', 'Live'],
    cap: 'Chase Agent Express — embedded edition',
    sub: 'A partner shell wrapped around the same search. Regulated financial institutions, so every edition ships at WCAG AA or AAA — accessibility is mine to own.',
    chips: ['WCAG AA / AAA', 'ARIA', 'Keyboard nav', 'Module Federation'],
    url: 'https://chase.homestory.co/', urlLabel: 'Open chase.homestory.co',
    img: 'screenshots/opt/homestory chase.jpg'
  },

  {
    project: 'Athletix', tag: ['wip', 'My own product · in development'],
    cap: 'Coach dashboard',
    sub: 'My own SaaS for sports clubs. Turbo monorepo, JWT auth with role-based access, a 60+ component library on Radix primitives, CSS Modules and design tokens. I do all of it — design, frontend, backend.',
    chips: ['Next.js', 'TypeScript', 'Turbo monorepo', 'Radix UI', 'MongoDB'],
    img: 'screenshots/opt/athletix dashboard.jpg'
  },
  {
    project: 'Athletix', tag: ['wip', 'My own product'],
    cap: 'Sessions — schedules and weekly calendar',
    sub: 'Recurring schedules across groups, generated sessions, cancellations and attendance state — the hardest data modelling in the product.',
    chips: ['Next.js', 'Node', 'REST', 'MongoDB', 'CSS Modules'],
    img: 'screenshots/opt/athletix sessions.jpg'
  },
  {
    project: 'Athletix', tag: ['wip', 'Design'],
    cap: 'Mobile companion — attendance flow in Figma',
    sub: 'I came into engineering from graphic design, so screens start in Figma. Every state is designed before it is built — empty, partial, complete, date picker.',
    chips: ['Figma', 'Design system', 'Interaction design'],
    img: 'screenshots/opt/athletix mobile figma.jpg'
  },
  {
    project: 'Athletix', tag: ['wip', 'Built'],
    cap: 'Mobile companion — mark attendance, built',
    sub: 'The same flow shipped in React Native and Expo, against the same backend as the web app.',
    chips: ['React Native', 'Expo', 'TypeScript'],
    img: 'screenshots/opt/athletix mobile mark att.jpg'
  },

  {
    project: 'Jupytero', ref: true, tag: ['guest', 'Reference only'],
    cap: 'Hiring / ATS platform — hiring manager dashboard',
    sub: 'Jobs and roles, talent pool, interview scheduling, career sites, analytics and workflow automation.',
    disc: '<b>Not my product, not part of my portfolio.</b> I am one contributor on a team here and I do not own it — it is included only as a reference for the kind of interface work I do day to day. Happy to walk through my specific contributions.',
    chips: ['React', 'TypeScript', 'Data tables', 'Dashboard UI'],
    img: 'screenshots/opt/yupytero dashboard.jpg'
  }
];

/* ═══ SOUND — WebAudio blips, no assets, off by default ═══ */
let audio = null, sound = false;
function blip(freq, dur) {
  if (!sound) return;
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = 'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.03, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
  o.connect(g).connect(audio.destination);
  o.start(); o.stop(audio.currentTime + dur);
}
const sndBtn = document.getElementById('snd');
sndBtn.addEventListener('click', () => {
  sound = !sound;
  sndBtn.setAttribute('aria-pressed', String(sound));
  sndBtn.textContent = sound ? '🔊' : '🔈';
  blip(880, 0.07);
});

/* ═══ RENDER ═════════════════════════════════════════════ */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const frame = document.getElementById('frame');
const stage = document.querySelector('.stage');
const info = document.getElementById('info');
const rail = document.getElementById('rail');
const pips = document.getElementById('pips');
const counter = document.getElementById('counter');
const live = document.getElementById('live');
let i = 0;

pips.innerHTML = S.map((s, k) =>
  `<button type="button" role="tab" data-k="${k}" class="${s.ref ? 'ref' : ''}" aria-label="Slide ${k + 1}"></button>`).join('');

rail.innerHTML = S.map((s, k) => s.intro
  ? `<button type="button" role="tab" data-k="${k}" class="intro" aria-label="Start">START</button>`
  : `<button type="button" role="tab" data-k="${k}" class="${s.ref ? 'ref' : ''}" aria-label="${esc(s.project)} — ${esc(s.cap)}">
       <img src="${s.img}" alt="" /></button>`).join('');

function render() {
  const s = S[i];
  stage.className = 'stage' + (s.ref ? ' ref' : '');

  if (s.intro) {
    frame.className = 'frame';
    frame.innerHTML = `
      <div class="intro">
        <div class="kick">Selected Work</div>
        <h1>Predrag Jovanovic</h1>
        <div class="class">Senior Frontend Engineer · Belgrade, Serbia</div>
        <div class="facts">
          <span><b>20</b>&nbsp; years in the field</span>
          <span><b>11</b>&nbsp; years on one product</span>
          <span><b>15+</b>&nbsp; bank editions shipped</span>
          <span><b>AAA</b>&nbsp; accessibility</span>
        </div>
        <div class="go">Press <kbd>→</kbd> to start · click any screenshot to enlarge</div>
      </div>`;
    info.className = 'info';
    info.innerHTML = `
      <div class="lead">
        <div class="proj">Contents</div>
        <div class="cap">HomeStory · Athletix · one reference project</div>
        <div class="sub">${S.length - 1} screenshots. Live sites open in a new tab.</div>
      </div>
      <a class="cta plain" href="../predrag-jovanovic-cv.pdf" download="Predrag-Jovanovic-CV.pdf">Download CV</a>
      <a class="cta plain" href="mailto:j.predrag@gmail.com">j.predrag@gmail.com</a>`;
  } else {
    frame.className = 'frame' + (s.ref ? ' ref' : '');
    frame.innerHTML = `<img src="${s.img}" alt="${esc(s.project)} — ${esc(s.cap)}" id="shot" />`;
    info.className = 'info' + (s.ref ? ' ref' : '');
    info.innerHTML = `
      <div class="lead">
        <div class="proj">${esc(s.project)} <span class="tag ${s.tag[0]}">${esc(s.tag[1])}</span></div>
        <div class="cap">${esc(s.cap)}</div>
        <div class="sub">${esc(s.sub)}</div>
      </div>
      <div class="chips">${s.chips.map(c => `<span>${esc(c)}</span>`).join('')}</div>
      ${s.url ? `<a class="cta" href="${s.url}" target="_blank" rel="noopener">${esc(s.urlLabel)}</a>` : ''}
      ${s.disc ? `<div class="disc">${s.disc}</div>` : ''}`;
  }

  counter.textContent = `${String(i + 1).padStart(2, '0')} / ${String(S.length).padStart(2, '0')}`;
  live.textContent = s.intro ? 'Start' : `${s.project} — ${s.cap}`;
  document.getElementById('prev').disabled = i === 0;
  document.getElementById('next').disabled = i === S.length - 1;

  [rail, pips].forEach(box => [...box.children].forEach((b, k) =>
    b.setAttribute('aria-current', String(k === i))));

  const active = rail.children[i];
  if (active.scrollIntoView) active.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

function go(n) {
  const next = Math.max(0, Math.min(S.length - 1, n));
  if (next === i) return;
  i = next;
  document.body.classList.remove('zoom');
  render();
  blip(760, 0.04);
}

document.getElementById('prev').addEventListener('click', () => go(i - 1));
document.getElementById('next').addEventListener('click', () => go(i + 1));
[rail, pips].forEach(box => box.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) go(+b.dataset.k);
}));

/* click the screenshot -> full-bleed */
frame.addEventListener('click', e => {
  if (e.target.id !== 'shot') return;
  document.body.classList.toggle('zoom');
  blip(1000, 0.05);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.body.classList.contains('zoom')) {
    document.body.classList.remove('zoom');
    return;
  }
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(i + 1); }
  if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(i - 1); }
  if (e.key === 'Home') go(0);
  if (e.key === 'End') go(S.length - 1);
  if (e.key.toLowerCase() === 'f' && !S[i].intro) document.body.classList.toggle('zoom');
});

/* swipe on touch */
let x0 = null;
addEventListener('touchstart', e => { x0 = e.changedTouches[0].clientX; }, { passive: true });
addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 60) go(i + (dx < 0 ? 1 : -1));
  x0 = null;
}, { passive: true });

render();
})();
</script>
</body>
</html>
